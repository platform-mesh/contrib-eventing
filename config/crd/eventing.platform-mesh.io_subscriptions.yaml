---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: subscriptions.eventing.platform-mesh.io
spec:
  group: eventing.platform-mesh.io
  names:
    kind: Subscription
    listKind: SubscriptionList
    plural: subscriptions
    singular: subscription
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Subscription delivers events of the whole platform to a sink. Platform
          admins create them in the eventing workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SubscriptionSpec says which events go where.
            properties:
              delivery:
                description: |-
                  Delivery controls retries when the sink does not accept an event, and what
                  happens to events the sink never accepted.
                properties:
                  backoffDelay:
                    description: BackoffDelay is the base delay between retries as
                      an ISO 8601 duration, e.g. PT0.5S.
                    pattern: ^P(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$
                    type: string
                  backoffPolicy:
                    enum:
                    - linear
                    - exponential
                    type: string
                  deadLetterSink:
                    description: DeadLetterSink gets the events the sink did not accept
                      after all retries.
                    properties:
                      uri:
                        pattern: ^https?://
                        type: string
                    required:
                    - uri
                    type: object
                  retry:
                    description: Retry is the number of retries after the first failed
                      attempt.
                    format: int32
                    minimum: 0
                    type: integer
                  timeout:
                    description: |-
                      Timeout is how long a single request to the sink may take, as an ISO 8601
                      duration, e.g. PT10S.
                    pattern: ^P(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$
                    type: string
                type: object
              filter:
                description: |-
                  Filter selects events. An event matches if its type is one of Types and, if
                  Orgs is set, its org (the pmorg extension) is one of Orgs.
                properties:
                  orgs:
                    items:
                      type: string
                    type: array
                  types:
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - types
                type: object
              sink:
                description: Sink is where matching events are sent, as CloudEvents
                  over HTTP.
                properties:
                  uri:
                    pattern: ^https?://
                    type: string
                required:
                - uri
                type: object
            required:
            - filter
            - sink
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
