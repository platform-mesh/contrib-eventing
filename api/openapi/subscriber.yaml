openapi: 3.1.0
info:
  title: Platform Mesh eventing subscriber endpoint
  version: v1alpha1
  summary: What an endpoint named in a Subscription receives and must answer.
  description: |
    Eventing POSTs one CloudEvent per request to the `sink.uri` of a
    Subscription, in CloudEvents HTTP binary mode: the attributes are `ce-*`
    headers, the event data is the JSON body. See docs/contract.md for the
    meaning of the fields.

    Answer with a 2xx status and an empty body, quickly. A non-empty body that
    is not a CloudEvent counts as a failed delivery. A body that is a
    CloudEvent is taken as a reply. Replies are blocked; with a dead letter
    sink the event you replied to also goes there.

    Delivery is at least once and unordered: drop events whose `ce-id` you have
    already seen.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
# The endpoint is yours; this is where the Subscription points.
servers:
  - url: '{sinkUri}'
    variables:
      sinkUri:
        default: http://my-consumer.my-namespace.svc.cluster.local
        description: The Subscription's sink.uri, reachable from inside the cluster.
# Requests come without credentials.
security: []
webhooks:
  membershipGranted:
    post:
      operationId: membershipGranted
      summary: A user got a role on an account.
      parameters:
        - $ref: '#/components/parameters/ceSpecversion'
        - $ref: '#/components/parameters/ceId'
        - $ref: '#/components/parameters/ceSource'
        - name: ce-type
          in: header
          required: true
          schema:
            const: io.platform-mesh.iam.membership.granted.v1alpha1
        - $ref: '#/components/parameters/ceSubject'
        - $ref: '#/components/parameters/ceTime'
        - $ref: '#/components/parameters/cePmorg'
      requestBody:
        $ref: '#/components/requestBodies/Membership'
      responses:
        '2XX':
          $ref: '#/components/responses/Delivered'
        '408':
          $ref: '#/components/responses/Retried'
        '429':
          $ref: '#/components/responses/Retried'
        '5XX':
          $ref: '#/components/responses/Retried'
        default:
          $ref: '#/components/responses/Failed'
  membershipRevoked:
    post:
      operationId: membershipRevoked
      summary: A user lost a role on an account.
      parameters:
        - $ref: '#/components/parameters/ceSpecversion'
        - $ref: '#/components/parameters/ceId'
        - $ref: '#/components/parameters/ceSource'
        - name: ce-type
          in: header
          required: true
          schema:
            const: io.platform-mesh.iam.membership.revoked.v1alpha1
        - $ref: '#/components/parameters/ceSubject'
        - $ref: '#/components/parameters/ceTime'
        - $ref: '#/components/parameters/cePmorg'
      requestBody:
        $ref: '#/components/requestBodies/Membership'
      responses:
        '2XX':
          $ref: '#/components/responses/Delivered'
        '408':
          $ref: '#/components/responses/Retried'
        '429':
          $ref: '#/components/responses/Retried'
        '5XX':
          $ref: '#/components/responses/Retried'
        default:
          $ref: '#/components/responses/Failed'
  accountMembers:
    post:
      operationId: accountMembers
      summary: The members of an account changed; this is the full list now.
      parameters:
        - $ref: '#/components/parameters/ceSpecversion'
        - $ref: '#/components/parameters/ceId'
        - $ref: '#/components/parameters/ceSource'
        - name: ce-type
          in: header
          required: true
          schema:
            const: io.platform-mesh.iam.account.members.v1alpha1
        - $ref: '#/components/parameters/ceSubject'
        - name: ce-time
          in: header
          required: true
          description: When the list was read. Keep the snapshot with the latest time.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/cePmorg'
      requestBody:
        $ref: '#/components/requestBodies/AccountMembers'
      responses:
        '2XX':
          $ref: '#/components/responses/Delivered'
        '408':
          $ref: '#/components/responses/Retried'
        '429':
          $ref: '#/components/responses/Retried'
        '5XX':
          $ref: '#/components/responses/Retried'
        default:
          $ref: '#/components/responses/Failed'
  userLoggedIn:
    post:
      operationId: userLoggedIn
      summary: A user logged in to an org's Keycloak realm.
      parameters:
        - $ref: '#/components/parameters/ceSpecversion'
        - $ref: '#/components/parameters/ceId'
        - $ref: '#/components/parameters/ceSource'
        - name: ce-type
          in: header
          required: true
          schema:
            const: io.platform-mesh.iam.user.loggedin.v1alpha1
        - $ref: '#/components/parameters/ceSubjectUser'
        - name: ce-time
          in: header
          required: true
          description: When the user logged in.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/cePmorg'
      requestBody:
        $ref: '#/components/requestBodies/UserLoggedIn'
      responses:
        '2XX':
          $ref: '#/components/responses/Delivered'
        '408':
          $ref: '#/components/responses/Retried'
        '429':
          $ref: '#/components/responses/Retried'
        '5XX':
          $ref: '#/components/responses/Retried'
        default:
          $ref: '#/components/responses/Failed'
components:
  parameters:
    ceSpecversion:
      name: ce-specversion
      in: header
      required: true
      schema:
        const: '1.0'
    ceId:
      name: ce-id
      in: header
      required: true
      description: Unique per event and the same on every redelivery. Use it to drop duplicates; do not parse it.
      schema:
        type: string
      example: 3d95f792518d1253545ad05aa72c9044
    ceSource:
      name: ce-source
      in: header
      required: true
      schema:
        type: string
        pattern: ^platform-mesh\.io/orgs/[^/]+/iam$
      example: platform-mesh.io/orgs/acme/iam
    ceSubject:
      name: ce-subject
      in: header
      required: true
      schema:
        type: string
        pattern: ^accounts/[^/]+/[^/]+$
      example: accounts/a5zld11wopsu1uea/team-a
    ceSubjectUser:
      name: ce-subject
      in: header
      required: true
      schema:
        type: string
        pattern: ^users/.+$
      example: users/alice@example.com
    ceTime:
      name: ce-time
      in: header
      required: true
      description: When the change happened.
      schema:
        type: string
        format: date-time
    cePmorg:
      name: ce-pmorg
      in: header
      required: true
      description: The org the event belongs to.
      schema:
        type: string
      example: acme
  requestBodies:
    Membership:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Membership'
          example:
            org: acme
            account: team-a
            accountId: a5zld11wopsu1uea/team-a
            accountPath: root:orgs:acme:team-a
            role: member
            user:
              id: alice@example.com
    UserLoggedIn:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserLoggedIn'
          example:
            org: acme
            user:
              id: alice@example.com
    AccountMembers:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountMembers'
          example:
            org: acme
            account: team-a
            accountId: a5zld11wopsu1uea/team-a
            accountPath: root:orgs:acme:team-a
            members:
              - user:
                  id: alice@example.com
                  firstName: Alice
                  lastName: Liddell
                roles: [owner]
              - user:
                  id: bob@example.com
                roles: [member]
  responses:
    Delivered:
      description: Delivered. The body must be empty.
    Retried:
      description: Failed for now; delivered again with backoff, up to the Subscription's retry count.
    Failed:
      description: Any other status is a failed delivery. It is not retried and does not go to the dead letter sink.
  schemas:
    Membership:
      type: object
      required: [org, account, accountId, role, user]
      properties:
        org:
          type: string
          description: Org name.
        account:
          type: string
          description: Account name. Nested accounts can share a name.
        accountId:
          type: string
          description: |
            The account, unique in the platform: the logical cluster of the workspace that
            holds the Account object and the account name (AccountInfo originClusterId/name).
        accountPath:
          type: string
          description: |
            The account's kcp workspace path, as the iam-service API uses it. Missing if the
            workspace that holds the Account was gone when the event was built.
        role:
          type: string
          description: Platform Mesh role, for example owner or member.
        user:
          $ref: '#/components/schemas/User'
    AccountMembers:
      type: object
      required: [org, account, accountId, members]
      properties:
        org:
          type: string
          description: Org name.
        account:
          type: string
          description: Account name. Nested accounts can share a name.
        accountId:
          type: string
          description: The account, as in Membership.
        accountPath:
          type: string
          description: The account's kcp workspace path, as in Membership.
        members:
          type: array
          description: Everyone with a role on the account, sorted by user id. Empty if the account was deleted.
          items:
            $ref: '#/components/schemas/Member'
    UserLoggedIn:
      type: object
      required: [org, user]
      properties:
        org:
          type: string
          description: Org name.
        user:
          $ref: '#/components/schemas/User'
    Member:
      type: object
      required: [user, roles]
      properties:
        user:
          $ref: '#/components/schemas/User'
        roles:
          type: array
          description: The user's roles on the account, sorted.
          items:
            type: string
    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: |
            The value Platform Mesh authorizes the user with: the claim the platform admin
            configured (security-operator --user-claim), email by default. Invitations are
            written with the email, also with the sub claim.
        firstName:
          type: string
          description: |
            Only in members snapshots, and only if Keycloak knows it and eventing can read
            it. Up to five minutes old.
        lastName:
          type: string
          description: Like firstName.
